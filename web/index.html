<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>주간 식단 앱</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">주간 식단 앱</header>

  <main>
    <section id="screen-plan" class="screen">
      <p class="placeholder">식단 화면은 Stage 2에서 만듭니다.</p>
    </section>

    <section id="screen-upload" class="screen active">
      <div class="privacy-warning">
        ⚠️ 주소·이름·전화번호·카드번호가 보이면 잘라서 올리세요.
      </div>

      <label class="field">
        업로드 종류
        <select id="upload-type">
          <option value="자주구매">자주구매</option>
          <option value="주문내역">주문내역</option>
          <option value="영수증">종이 영수증</option>
        </select>
      </label>

      <label class="field">
        이미지 선택 (여러 장)
        <input id="file-input" type="file" accept="image/*" multiple />
      </label>

      <div id="file-summary" class="muted"></div>

      <button id="btn-extract" class="btn-primary" disabled>추출 시작</button>

      <div id="progress" class="muted"></div>

      <div id="review-list" class="review-list"></div>

      <div id="review-actions" class="review-actions hidden">
        <button id="btn-merge-selected" class="btn-secondary">선택한 품목 합치기</button>
        <button id="btn-save" class="btn-primary">검수 완료 · 저장</button>
      </div>

      <div id="save-result" class="muted"></div>
    </section>

    <section id="screen-inventory" class="screen">
      <p class="placeholder">재고 화면은 Stage 3에서 만듭니다.</p>
    </section>

    <section id="screen-settings" class="screen">
      <label class="field">
        접속 토큰(ACCESS_TOKEN)
        <input id="token-input" type="password" placeholder="GAS Script Properties의 ACCESS_TOKEN과 동일하게" />
      </label>
      <button id="btn-save-token" class="btn-primary">토큰 저장</button>
      <p class="muted">이 기기의 브라우저에만 저장됩니다. 식구 수 등 나머지 설정은 Stage 2에서 추가합니다.</p>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab-btn active" data-screen="plan">식단</button>
    <button class="tab-btn" data-screen="upload">업로드</button>
    <button class="tab-btn" data-screen="inventory">재고</button>
    <button class="tab-btn" data-screen="settings">설정</button>
  </nav>

  <script src="config.js"></script>
  <script src="lib/itemKey.js"></script>
  <script src="lib/merge.js"></script>
  <script src="image.js"></script>
  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
